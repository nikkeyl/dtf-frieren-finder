name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: Parser checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sh -n parser.sh
      - run: python3 -m unittest discover -s tests -v

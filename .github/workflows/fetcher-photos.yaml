name: Fetch Photos

on:
  schedule:
    - cron: 0 * * * *

concurrency:
  group: fetch-photos
  cancel-in-progress: false

jobs:
  fetcher:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TARGET_DIR: ${{ runner.temp }}/dtf-frieren-photos
      ATTACHMENTS_DIR: ${{ runner.temp }}/dtf-frieren-attachments

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare Workspace
        run: mkdir -p "$TARGET_DIR" "$ATTACHMENTS_DIR"

      - name: Make Script Executable
        run: chmod +x parser.sh

      - name: Execute Parser Script
        run: ./parser.sh

      - name: Filter New Photos
        id: filter_logic
        run: |
          touch last_sent.txt

          HAS_NEW=false

          for file in "$TARGET_DIR"/*; do
            [ -f "$file" ] || continue

            filename=$(basename "$file")

            if ! grep -qxF "$filename" last_sent.txt; then
              cp "$file" "$ATTACHMENTS_DIR/"

              echo "$filename" >> last_sent.txt

              HAS_NEW=true
            fi
          done

          if [ "$HAS_NEW" = true ]; then
            echo "send_mail=true" >> $GITHUB_OUTPUT
          else
            echo "send_mail=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Photos via Apple Mail
        if: steps.filter_logic.outputs.send_mail == 'true'
        uses: dawidd6/action-send-mail@42942bc2f8fba4e611b459a018967a6a7c78c68c
        with:
          server_address: smtp.mail.me.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "フリーレンの新着写真！"
          to: ${{ secrets.MAIL_USERNAME }}
          from: GitHub Actions Finder <${{ secrets.MAIL_USERNAME }}>
          body: |
            こんにちは！

            スクリプトが更新を確認し、フリーレンの新しい写真をダウンロードしました。
            このメールにファイルを添付してお送りします。

            よろしくお願いします！
          attachments: ${{ env.ATTACHMENTS_DIR }}/*

      - name: Commit Sent-File History
        if: ${{ success() && steps.filter_logic.outputs.send_mail == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain -- last_sent.txt)" ]; then
            git add -- last_sent.txt
            git commit -m "chore: update sent image history"
            git push
          fi
